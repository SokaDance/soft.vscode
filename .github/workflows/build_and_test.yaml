name: Build and Test

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [master]
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  packages: read

jobs:
  build_and_test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          # @masagroup/ecore is published on GitHub Packages, which needs a token even for public packages
          registry-url: https://npm.pkg.github.com
          scope: "@masagroup"
      - name: Install dependencies
        run: npm ci --no-fund
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Typecheck
        run: npm run typecheck
      - name: Test
        run: npm test
      - name: Build
        run: npm run build
      - name: Package
        run: npx vsce package --no-dependencies
      - name: Upload VSIX
        uses: actions/upload-artifact@v4
        with:
          name: ecorium-vsix
          path: "*.vsix"
          if-no-files-found: error
